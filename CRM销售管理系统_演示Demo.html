function trade(c){return S.orders.some(o=>o.customer===c.id&&o.status!=='cancelled')}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(err){storageWorks=false;toast('浏览器限制本地存储，本次操作仅在当前页面有效。','error')}}
function log(action,object){S.audits.unshift({at:S.now,actor:U.mode==='portal'?'客户 '+cust(U.customer).contact:U.role,action,object});save()}
function toast(text,type=''){const box=document.createElement('div');box.className='toast '+type;box.innerHTML=icon(type==='error'?'alert':'check')+`<span>${e(text)}</span>`;document.getElementById('toasts').appendChild(box);setTimeout(()=>box.remove(),4800)}
function pill(s,c=''){return `<span class="pill ${c}">${e(s)}</span>`}
function button(text,action,id='',style='',ico=''){return `<button type="button" class="btn ${style}" data-action="${action}" ${id?`data-id="${e(id)}"`:''}>${ico?icon(ico):''}${e(text)}</button>`}
function link(text,action,id=''){return `<button type="button" class="linkbtn" data-action="${action}" data-id="${e(id)}">${e(text)}</button>`}
function empty(text='暂无匹配记录'){return `<div class="empty">${icon('inbox')}<p>${e(text)}</p></div>`}
function avatar(c){return `<span class="avatar ${['c3','c5'].includes(c.id)?'blue':''}">${e(c.en?.match(/^[A-Z]/)?c.en.slice(0,2).toUpperCase():c.name.slice(0,1))}</span>`}
function kv(k,v){return `<div class="kv"><div class="label">${e(k)}</div><div class="value">${v}</div></div>`}
function notice(t,type=''){return `<div class="notice ${type}">${icon(type==='warning'?'alert':'info')}<div>${t}</div></div>`}
function stat(label,value,foot,ico='trend',isMoney=false){return `<div class="card stat"><div class="statlabel">${e(label)}<span class="stat-icon">${icon(ico)}</span></div><div class="statvalue ${isMoney?'money':''}">${value}</div><div class="foot">${foot}</div></div>`}
function pagehead(title,sub,actions='',eyebrow='CRM / SALES WORKSPACE'){return `<div class="pagehead"><div><div class="eyebrow">${e(eyebrow)}</div><h1>${e(title)}</h1><p>${e(sub)}</p></div><div class="flex wrap">${actions}</div></div>`}
function scopeName(){return isSales()?'本人负责的数据':U.role==='manager'?'销售团队数据':U.role==='warehouse'?'已分配履约数据':U.role==='finance'?'财务业务数据':U.role==='admin'?'系统配置数据':'企业全量业务数据'}
function allowedViews(){if(U.role==='admin')return ['data','settings'];if(U.role==='warehouse')return ['dashboard','products','orders','inventory','tasks'];if(U.role==='finance')return ['dashboard','customers','orders','contracts','payments','tasks','data'];if(isSales())return ['dashboard','customers','products','inquiries','quotes','orders','contracts','inventory','payments','tasks','data'];return Object.keys(views)}
function fquery(){return (U.filters[U.view]?.q||'').toLowerCase()}
function match(text){return !fquery()||String(text).toLowerCase().includes(fquery())}
function filterValue(){return U.filters[U.view]?.status||'all'}
function toolbar(placeholder,statuses=[],count=0,extra=''){return `<div class="toolbar"><input id="pageSearch" data-search="page" aria-label="${e(placeholder)}" placeholder="${e(placeholder)}" value="${e(U.filters[U.view]?.q||'')}">${statuses.length?`<select data-change="filterStatus" aria-label="状态筛选"><option value="all">全部状态</option>${statuses.map(x=>`<option value="${e(x[0])}" ${filterValue()===x[0]?'selected':''}>${e(x[1])}</option>`).join('')}</select>`:''}${extra}<span class="count">${count} 条记录 · ${scopeName()}</span></div>`}
function table(headers,rows){return rows.length?`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty()}
function tr(cells){return '<tr>'+cells.map(x=>`<td>${x}</td>`).join('')+'</tr>'}
function orderStatus(o){if(o.status==='completed')return ['已完成','green'];if(o.status==='cancelled')return ['已取消',''];if(o.stage==='not_started')return paid(o)>=deposit(o)?['待生产释放','blue']:['待收预付款','amber'];return {producing:['生产中','blue'],ready:['待发运','amber'],shipped:['运输中','blue'],delivered:['已签收','green']}[o.stage]||['待确认','']}
function orderPill(o){return pill(...orderStatus(o))}
function quoteStatus(q){return q.status==='approved'?[q.published?'已发布':'已批准',q.published?'green':'blue']:{draft:['草稿',''],pending:['待审批','amber'],rejected:['已退回','red'],accepted:['已接受','green'],superseded:['旧版本',''],void:['已作废','']}[q.status]||[q.status,'']}
function paymentPill(o){return paid(o)>=o.total?pill('已收齐','green'):balance(o)>0&&new Date(dateTime(o.balanceDue))<now()?pill('尾款逾期','red'):paid(o)>0?pill('部分回款','blue'):pill('未收款','amber')}
function dueFor(type,o){if(o.manualNext&&o.next)return o.next;const days=type==='customer'?(trade(o)?S.rules.customerActive:S.rules.customerProspect):type==='quote'?S.rules.quoteDays:S.rules.orderDays;return addDays(o.last||dateTime(o.date||o.since),days)}
function getTasks(){const ts=[];for(const o of S.orders){if(['completed','cancelled'].includes(o.status))continue;const due=dueFor('order',o);if(new Date(due)<=now())ts.push({key:'order:'+o.id+':'+due,type:'order',entity:o.id,customer:o.customer,title:orderStatus(o)[0]+'订单待跟进',detail:o.id,owner:o.owner,due});if(balance(o)>0&&new Date(dateTime(o.balanceDue))<=now())ts.push({key:'payment:'+o.id+':'+o.balanceDue,type:'payment',entity:o.id,customer:o.customer,title:'应收尾款已到期',detail:money(balance(o),o.currency),owner:'finance',due:dateTime(o.balanceDue)});}
for(const c of S.customers){const due=dueFor('customer',c);if(new Date(due)<=now())ts.push({key:'customer:'+c.id+':'+due,type:'customer',entity:c.id,customer:c.id,title:trade(c)?'成交客户定期维护':'新客户联系跟进',detail:c.name,owner:c.owner,due});}
for(const q of S.quotes){if(q.status==='pending'){const d=new Date(new Date(q.stepStartedAt||dateTime(q.date)).getTime()+S.rules.approvalHours*3600000).toISOString();if(new Date(d)<=now())ts.push({key:'approval:'+q.id+':'+q.step+':'+d,type:'approval',entity:q.id,customer:q.customer,title:'报价审批即将影响交期',detail:q.id,owner:q.approvers[q.step],due:d});}else if(q.status==='approved'&&q.published&&new Date(q.valid+'T23:59:59+08:00')>=now()){const due=dueFor('quote',q);if(new Date(due)<=now())ts.push({key:'quote:'+q.id+':'+due,type:'quote',entity:q.id,customer:q.customer,title:'已发布报价待回访',detail:q.id,owner:q.owner,due});}}
return ts.sort((a,b)=>new Date(a.due)-new Date(b.due));}
function tasks(){return getTasks().filter(t=>{if(U.mode==='portal'||U.role==='admin')return false;if(U.role==='finance')return t.type==='payment';if(U.role==='warehouse')return t.type==='order';if(isSales())return t.owner===U.role;return true})}
function art(p,mini=false){const colors={cup:['#e9eee8','#c4d1c4'],bag:['#ecefeb','#64746b'],book:['#eaf0ec','#387e70'],umbrella:['#ebeff2','#8aabb9'],tote:['#f3eee3','#c5af87'],box:['#f0eae3','#c5aa85']};const col=colors[p.kind]||colors.box;const shape={cup:`<ellipse cx="140" cy="207" rx="49" ry="9" fill="#475e4720"/><path d="M104 61h72l-6 133q-29 12-60 0z" fill="url(#g-cup)" stroke="#b4c1b1"/><path d="M100 54q39-8 80 0v15h-80z" fill="#4a6152"/><path d="M110 70h60l-2 22h-56z" fill="#e3e8df"/><path d="M115 100l3 78" stroke="#fff" stroke-width="7" opacity=".65"/><path d="M133 138h16" stroke="#8a9c87" stroke-width="2"/><text x="141" y="152" fill="#849480" font-size="7" text-anchor="middle" font-family="Arial" letter-spacing="2">CRM</text>`,bag:`<ellipse cx="140" cy="211" rx="63" ry="9" fill="#33453318"/><path d="M113 70V56q26-26 52 0v14" stroke="#576a5f" stroke-width="10" fill="none"/><path d="M93 59q48-12 94 1l13 135q-57 18-119 0z" fill="url(#g-bag)"/><path d="M93 65l-8 117 M186 65l10 117" stroke="#465c50" stroke-width="5"/><path d="M99 124h83l4 60q-42 13-92 0z" fill="#7c8b7f" stroke="#52675a"/><path d="M104 132h74" stroke="#d9dfd6" stroke-width="2"/><rect x="128" y="89" width="28" height="12" rx="3" fill="#c1c9bb"/><path d="M180 134v9" stroke="#dde5d8" stroke-width="3"/>`,book:`<ellipse cx="143" cy="209" rx="69" ry="9" fill="#33453316"/><path d="M89 49l105 12v143L85 190z" fill="#e4e5d8"/><path d="M82 43l108 13v144L82 187z" fill="url(#g-book)"/><path d="M91 44v144" stroke="#a2cab9" stroke-width="2" opacity=".55"/><path d="M170 54v144" stroke="#255e53" stroke-width="5"/><path d="M128 104l30 4 M128 112l30 4" stroke="#abcbba" stroke-width="1.5"/><text x="142" y="137" transform="rotate(6,142,137)" fill="#c8ded0" font-family="Georgia" text-anchor="middle" font-size="9" letter-spacing="1.4">NOTES</text>`,umbrella:`<ellipse cx="141" cy="212" rx="59" ry="8" fill="#33453312"/><path d="M140 48v149q0 16 17 16t17-18" fill="none" stroke="#465a64" stroke-width="7" stroke-linecap="round"/><path d="M48 121q16-67 92-70 77 3 93 70-23-14-45 0-25-13-48 0-22-14-45 0-23-14-47 0z" fill="url(#g-umbrella)"/><path d="M140 51q-45 22-45 70 M140 51q46 24 48 70 M140 51v70" fill="none" stroke="#587d90" stroke-width="1.5" opacity=".7"/><path d="M140 45v9" stroke="#465a64" stroke-width="4" stroke-linecap="round"/>`,tote:`<ellipse cx="140" cy="212" rx="66" ry="9" fill="#53452a14"/><path d="M94 82q-9-61 31-61t19 62 M138 83q-9-61 31-61t19 62" stroke="#b9a177" stroke-width="8" fill="none"/><path d="M78 77h126l-12 128q-50 11-102 0z" fill="url(#g-tote)" stroke="#c7b38e"/><path d="M87 83h107l-10 115" fill="none" stroke="#ede4d0" stroke-width="3"/><text x="142" y="138" fill="#8c9378" font-family="Georgia" font-size="13" text-anchor="middle" letter-spacing="1.5">everyday.</text><path d="M124 149h35" stroke="#8e9a80" stroke-width="1.5"/>`,box:`<ellipse cx="142" cy="208" rx="76" ry="10" fill="#53452a15"/><path d="M66 103l74-41 81 43-78 45z" fill="#d4bfa1"/><path d="M66 103l77 47v58l-77-47z" fill="#b59a73"/><path d="M143 150l78-45v57l-78 46z" fill="#c3aa87"/><path d="M62 98l78-44 85 45-82 46z" fill="url(#g-box)"/><path d="M62 98v16l81 48v-17z" fill="#c0a17b"/><path d="M143 145l82-46v16l-82 47z" fill="#d1b795"/><path d="M99 77l83 45v16l-14 9v-16l-83-46z" fill="#527c67"/><path d="M169 70l-80 44v16l14 8v-16l80-44z" fill="#507964"/>`}[p.kind]||'';return `<svg viewBox="0 0 280 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${e(p.name)}示意"><defs><linearGradient id="g-${p.kind}" x1="0" x2="1"><stop stop-color="${col[1]}"/><stop offset=".4" stop-color="${p.kind==='cup'?'#f1f0e6':col[1]}"/><stop offset="1" stop-color="${p.kind==='cup'?'#bfcab9':p.kind==='bag'?'#8b988a':p.kind==='book'?'#509180':p.kind==='umbrella'?'#b3c9cf':p.kind==='tote'?'#e1d5b9':'#e1cfb5'}"/></linearGradient></defs>${!mini?`<circle cx="140" cy="128" r="92" fill="#ffffff24"/>`:''}${shape}</svg>`}
function footer(){return `<div class="footer-note"><span>CRM销售管理系统　｜　从报价到回款，每一步都有依据。</span><span>交互演示 · 虚构数据 · ${storageWorks?'更改仅保存在本机浏览器':'本地存储受限'}　${link('演示说明','help')}</span></div>`}
function render(){if(U.mode==='portal'){renderPortal();return}if(!allowedViews().includes(U.view))U.view=allowedViews()[0];const pending=quotes().filter(q=>q.status==='pending').length;const renderers={dashboard:renderDashboard,customers:renderCustomers,products:renderProducts,inquiries:renderInquiries,quotes:renderQuotes,orders:renderOrders,contracts:renderContracts,inventory:renderInventory,payments:renderPayments,tasks:renderTasks,data:renderData,settings:renderSettings};document.getElementById('app').innerHTML=`<aside class="sidebar ${U.mobile?'open':''}"><div class="brand"><div class="mark">CRM</div><div><strong>CRM销售管理系统</strong><div class="sub">SALES WORKSPACE</div></div></div><div class="navgroup">业务协同 / WORKSPACE</div><nav class="navitems" aria-label="业务导航">${allowedViews().map(v=>`<button class="navitem ${U.view===v?'active':''}" data-view="${v}">${icon(views[v][1])}<span>${views[v][0]}</span>${v==='quotes'&&pending?`<span class="navcount">${pending}</span>`:v==='tasks'&&tasks().length?`<span class="navcount">${tasks().length}</span>`:''}</button>`).join('')}</nav><div class="sidebottom"><div class="demo-indicator"><div class="flex" style="gap:7px"><i class="dot"></i>演示工作空间</div><div style="margin-top:4px;color:#728e97;font-size:10px">虚构业务 · 本机保存 · 不含真实数据</div></div><div class="sideprofile"><div class="avatar">${e(roles[U.role].name.slice(0,1))}</div><div><strong>${e(roles[U.role].name)} · ${e(roles[U.role].short)}</strong><br><small>${e(scopeName())}</small></div></div></div></aside><div class="shell"><header class="topbar"><button class="btn iconbtn mobilemenu" data-action="mobileMenu" aria-label="展开导航">${icon('menu')}</button><form class="topsearch" data-form="globalSearch">${icon('search')}<input aria-label="全局搜索" name="q" placeholder="搜索客户、商品或订单…" value="${e(U.globalSearch)}"></form><div class="time">${icon('calendar')}　演示时间 ${niceDate(S.now)}</div><button class="btn iconbtn topguide" data-action="guide" title="快速演示" aria-label="快速演示">${icon('play')}</button><button class="btn iconbtn" data-action="notifications" title="通知中心" aria-label="通知中心">${icon('bell')}</button><select class="roleselect" data-change="role" aria-label="切换内部演示角色">${Object.entries(roles).map(([r,x])=>`<option value="${r}" ${U.role===r?'selected':''}>${x.name} · ${x.label}</option>`).join('')}</select>${button('客户门户','portal','','soft','external')}</header><main class="content">${renderers[U.view]()}${footer()}</main></div>`;}
function goto(v){U.view=v;U.tab='';U.mobile=false;U.globalSearch='';render();window.scrollTo({top:0,behavior:'smooth'})}
function currencySelect(){return `<select data-change="currency" aria-label="报表统计币种"><option value="CNY" ${U.currency==='CNY'?'selected':''}>CNY · 人民币</option><option value="USD" ${U.currency==='USD'?'selected':''}>USD · 美元</option></select>`}
function renderDashboard(){const os=orders().filter(o=>o.currency===U.currency&&o.status!=='cancelled');const active=orders().filter(o=>!['completed','cancelled'].includes(o.status));const total=os.reduce((s,o)=>s+o.total,0), collected=os.reduce((s,o)=>s+paid(o),0),due=os.filter(o=>new Date(dateTime(o.balanceDue))<now()).reduce((s,o)=>s+balance(o),0);const pending=quotes().filter(q=>q.status==='pending');const todo=tasks();const ris=orders().filter(o=>!['completed','cancelled'].includes(o.status)).sort((a,b)=>new Date(a.last)-new Date(b.last)).slice(0,5);
const kpis=moneyVisible()?stat('已确认订单金额',money(total,U.currency),'本年度样例数据 · '+os.length+' 笔订单','document',true)+stat('已核实回款',money(collected,U.currency),pill(total?Math.round(collected/total*100)+'% 回款覆盖率':'暂无订单','green'),'wallet',true)+stat('已到期未收',money(due,U.currency),due?pill('需要协调跟进','red'):'当前无逾期应收','clock',true)+stat('待处理提醒',String(todo.length),'订单、客户、审批与应收分别计时','bell'):stat('履约中订单',active.length,'已确认、未完结的生产与交付任务','truck')+stat('待生产 / 生产中',active.filter(o=>['not_started','producing'].includes(o.stage)).length,'付款门槛由财务核实','box')+stat('待发运订单',active.filter(o=>o.stage==='ready').length,'核对数量、交期与运单信息','layers')+stat('低库存 SKU',S.products.filter(p=>available(p)<p.safe).length,'按可用库存计算，不含预留','alert');
const stages=[['客户申请',inquiries().filter(x=>x.status==='new').length,'inquiries'],['报价审批',pending.length,'quotes'],['待生产释放',active.filter(x=>x.stage==='not_started').length,'orders'],['生产 / 备货',active.filter(x=>x.stage==='producing').length,'orders'],['发运 / 运输',active.filter(x=>['ready','shipped'].includes(x.stage)).length,'orders'],['已签收待结清',active.filter(x=>x.stage==='delivered').length,'payments']];
return pagehead('经营总览','每一份报价、每一笔订单与回款，进展清晰可见。',`${moneyVisible()?currencySelect():''}${button('快速演示','guide','','','play')}`)+`<div class="grid4">${kpis}</div><div class="stageflow">${stages.map(([label,n,v],i)=>`<div class="stage"><span class="idx">0${i+1}</span><div class="label">${label}</div><button class="linkbtn value" data-view="${allowedViews().includes(v)?v:'orders'}">${n}<span style="font-size:11px;font-weight:400;color:#95a4a8;margin-left:8px">笔</span></button></div>`).join('')}</div><div class="dashgrid"><section class="card"><div class="cardhead"><div><h3>${moneyVisible()?'订单与回款趋势':'订单履约分布'}</h3><div class="small muted" style="font-size:10px;margin-top:3px">${moneyVisible()?'按订单确认月份分组 · '+U.currency+' · 对应订单截至当前已收':'当前演示数据 · 订单阶段'}</div></div>${pill('2026 年','green')}</div><div class="cardbody">${moneyVisible()?trendChart(os):fulfillmentChart(active)}<div class="between" style="padding-top:8px;border-top:1px solid #edf2ef"><span class="small muted" style="font-size:11px">${moneyVisible()?'不同币种独立统计，不做未经说明的合并':'履约与资金状态分别记录'}</span>${link('查看订单 →','nav','orders')}</div></div></section><section class="card"><div class="cardhead"><h3>今天需要关注</h3>${link('全部待办 →','nav','tasks')}</div><div class="cardbody" style="padding-top:4px;padding-bottom:4px">${todo.slice(0,3).map(t=>`<div class="taskline"><span class="taskicon ${t.type==='approval'?'amber':''}">${icon(t.type==='payment'?'wallet':t.type==='approval'?'document':t.type==='customer'?'users':'clock')}</span><div class="grow"><h4>${link(t.title,'taskOpen',t.key)}</h4><p>${e(cust(t.customer)?.name||'')} · ${e(roleName(t.owner))}</p></div>${pill(lateText(t.due),t.type==='approval'?'amber':'red')}</div>`).join('')||empty('暂无逾期待办')}<div style="padding:13px 0">${notice('提醒依据演示时钟计算。关闭页面后，此离线Demo不会真实发送消息。')}</div></div></section></div><section class="card mt"><div class="cardhead"><div><h3>重点订单跟踪</h3><div class="muted" style="font-size:10px;margin-top:3px">按最近跟进时间排序 · 点击订单查看完整业务链路</div></div>${link('全部订单 →','nav','orders')}</div>${table(['订单 / 客户','履约状态',moneyVisible()?'订单金额':'预计交期',moneyVisible()?'回款状态':'生产进度','最近跟进','操作'],ris.map(o=>tr([link(o.id,'orderDetail',o.id)+`<div class="secondary">${e(cust(o.customer).name)}</div>`,orderPill(o),moneyVisible()?`<span class="num">${money(o.total,o.currency)}</span>`:niceDate(o.eta),moneyVisible()?paymentPill(o):`${o.progress}%<div class="progress"><i style="width:${o.progress}%"></i></div>`,niceDate(o.last)+(new Date(dueFor('order',o))<=now()?`<div class="secondary" style="color:var(--red)">${lateText(dueFor('order',o))}</div>`:''),canFollow()?button('记录跟进','follow','order|'+o.id,'sm','edit'):button('查看详情','orderDetail',o.id,'sm')])))} </section>`}
function trendChart(os){const ms=[5,6,7,8,9,10];const data=ms.map(m=>{const aa=os.filter(o=>Number(o.date.slice(5,7))===m);return {m,total:aa.reduce((s,o)=>s+o.total,0),paid:aa.reduce((s,o)=>s+paid(o),0)}});const max=Math.max(1,...data.map(x=>x.total));return `<div class="chartlegend"><span><i></i>确认订单金额</span><span><i class="light"></i>对应订单已收款</span><span style="margin-left:auto">单位：${U.currency}</span></div><div class="chart">${data.map(x=>`<div class="bargroup"><div class="bar" title="${x.m}月确认金额 ${money(x.total,U.currency)}" style="height:${x.total/max*95}%"></div><div class="bar light" title="对应订单已收 ${money(x.paid,U.currency)}" style="height:${x.paid/max*95}%"></div><span class="barlabel">${String(x.m).padStart(2,'0')}月</span></div>`).join('')}</div>`}
function fulfillmentChart(os){const cats=[['not_started','待释放'],['producing','生产中'],['ready','待发运'],['shipped','运输中'],['delivered','已签收']];return `<div style="padding:6px 0">${cats.map(([s,label])=>{const n=os.filter(o=>o.stage===s).length;return `<div class="between" style="margin-bottom:14px"><span class="small muted" style="width:65px">${label}</span><div class="progress grow" style="margin:0"><i style="width:${n/(os.length||1)*100}%"></i></div><strong style="width:25px;text-align:right">${n}</strong></div>`}).join('')}</div>`}

function customerDetail(id){const c=cust(id);if(!c||!visibleCustomer(c))return accessError();const os=orders().filter(o=>o.customer===id&&o.status!=='cancelled');const year=dayStr().slice(0,4);const ys=os.filter(o=>o.date.startsWith(year));const values=['CNY','USD'].map(cur=>{const r=ys.filter(o=>o.currency===cur);return r.length?`<div class="card cardbody" style="box-shadow:none"><div class="between"><strong>${cur} · ${year} 年</strong>${pill(r.length+' 笔订单','green')}</div><div class="kvgrid mt">${kv('确认订单金额',`<strong>${money(r.reduce((a,o)=>a+o.total,0),cur)}</strong>`)}${kv('上述订单已收',`<strong>${money(r.reduce((a,o)=>a+paid(o),0),cur)}</strong>`)}${kv('未结余额',`<strong>${money(r.reduce((a,o)=>a+balance(o),0),cur)}</strong>`)}</div></div>`:''}).join('');const follow=S.follows.filter(x=>x.customer===id).slice().reverse();const purchases={};for(const o of ys)for(const i of o.items)purchases[i.name]=(purchases[i.name]||0)+i.qty;
modal('客户档案 · '+c.name,`<div class="between wrap"><div class="flex gap16">${avatar(c)}<div><h2>${e(c.name)}</h2><p class="small muted">${e(c.country)} · ${e(c.industry)} · 建档 ${niceDate(c.since)}</p></div></div><div class="chipline">${pill(trade(c)?'已成交':'未成交',trade(c)?'green':'amber')}${c.tags.map(t=>pill(t)).join('')}</div></div><div class="divider"></div><div class="kvgrid">${kv('联系人',e(c.contact))}${kv('电子邮箱',e(c.email))}${kv('联系电话',e(c.phone))}${kv('客户负责人',e(roleName(c.owner)))}${kv('最近有效维护',niceDate(c.last))}${kv('下次维护计划',niceDate(dueFor('customer',c))+(new Date(dueFor('customer',c))<=now()?' '+pill('已到期','red'):''))}</div><h3 class="mt" style="margin-bottom:12px">客户年度小结</h3>${values||notice('尚无正式订单，当前为未成交客户。')}<p class="small muted" style="font-size:10px;margin-top:10px">统计口径：${year}年确认的非取消订单，金额按原币分别统计；已收为这些订单截至演示时钟的有效核销额。</p><div class="mt">${kv('本年采购商品',Object.entries(purchases).map(([n,q])=>`${e(n)} × ${q.toLocaleString()}件`).join('　 /　 ')||'暂无订单')}</div><h3 class="mt" style="margin-bottom:12px">订单历史</h3>${table(['订单','状态','金额','已收 / 余额','操作'],os.map(o=>tr([e(o.id),orderPill(o),money(o.total,o.currency),`${money(paid(o),o.currency)} / ${money(balance(o),o.currency)}`,button('查看','orderDetail',o.id,'sm')])))}<h3 class="mt" style="margin-bottom:15px">沟通时间线</h3>${follow.length?`<div class="timelinelist">${follow.map(f=>`<div class="tl"><i class="node"></i><div><div class="text">${e(f.summary)}</div><div class="time">${e(f.channel)} · ${e(roleName(f.actor))} · ${niceDate(f.at,true)} · ${e(f.entity)}</div></div></div>`).join('')}</div>`:notice('暂无历史跟进记录，可在本档案中记录下一次沟通。')}`,button('关闭','close')+(canFollow()?button('记录客户维护','follow','customer|'+id,'primary','edit'):''),'wide')}
function productDetail(id){const p=prod(id);if(!p)return;const portal=U.mode==='portal';const c=cust(U.customer);modal(T('产品资料','Product details')+' · '+(portal&&U.lang==='en'?p.en:p.name),`<div class="grid2"><div style="background:#eef2ec;border-radius:13px;min-height:245px;display:flex;justify-content:center">${art(p)}</div><div><span class="small mono muted">${e(p.sku)}</span><h2 style="margin:8px 0">${e(portal&&U.lang==='en'?p.en:p.name)}</h2><p class="small muted">${e(portal&&U.lang==='en'?p.specEn:p.spec)}</p><div class="divider"></div><div class="kvgrid">${moneyVisible()?kv(T('标准人民币价','CNY reference'),money(p.price))+kv(T('标准美元价','USD reference'),money(p.usd,'USD')):''}${kv(T('起订量','Minimum quantity'),p.moq+' '+T('件','units'))}${kv(T('预计交期','Lead time'),p.lead+' '+T('天','days'))}${kv(T('供应状态','Availability'),portal?T('可询价 / 以确认交期为准','Available on request'):available(p)+' 件可用')}${costVisible()?kv('采购成本（受限）',p.cost==null?'待核价':money(p.cost)):''}</div><div class="mt">${notice(T('仅为演示参考资料，实际成交价格与交期以批准后的正式报价为准。','Reference information only. Approved quotations determine transaction prices and delivery dates.'))}</div></div></div>`,button(T('关闭','Close'),'close')+(portal?button(T('加入申请','Add to list'),'addBasket',p.id,'primary','plus'):costVisible()?button('维护成本','editCost',p.id,'primary','lock'):''))}
function lineTable(items,cur,showMoney=true){return table([T('商品 / 规格','Product / specification'),T('数量','Quantity'),...(showMoney?[T('单价','Unit price'),T('金额','Amount')]:[]),...(costVisible()?['参考成本 / 件']:[])],items.map(i=>tr([`<strong style="font-weight:550">${e(U.mode==='portal'&&U.lang==='en'?i.en||prod(i.product)?.en:i.name||prod(i.product)?.name)}</strong><div class="secondary">${e(i.sku||prod(i.product)?.sku)} · ${e(i.spec||prod(i.product)?.spec)}</div>`,i.qty.toLocaleString(),...(showMoney?[money(i.price,cur),money(i.price*i.qty,cur)]:[]),...(costVisible()?[money(i.cost??prod(i.product)?.cost)]:[])])))}
function orderDetail(id){const o=findOrder(id);if(!canSeeOrder(o))return accessError();const portal=U.mode==='portal';const c=cust(o.customer);const seq=['not_started','producing','ready','shipped','delivered'];let idx=o.stage==='completed'?4:seq.indexOf(o.stage);const rec=S.receipts.filter(r=>r.order===id&&(!portal||r.status==='verified'));const f=S.follows.filter(r=>r.type==='order'&&r.entity===id);const pendingAmount=S.receipts.filter(r=>r.order===id&&r.status==='pending').reduce((a,r)=>a+r.amount,0);const actions=button(T('关闭','Close'),'close')+(!portal&&canFollow()&&o.status==='confirmed'?button('记录跟进','follow','order|'+id,'','edit'):'')+(!portal&&U.role==='finance'&&balance(o)>0?button('登记回款','newReceipt',id,'primary','wallet'):'')+(!portal&&U.role==='warehouse'&&o.status==='confirmed'&&['not_started','producing','ready','shipped'].includes(o.stage)?button({not_started:'释放生产',producing:'完成生产并入库',ready:'登记发运',shipped:'登记签收'}[o.stage],'advanceOrder',id,'primary','arrow'):'')+(!portal&&canFollow()&&o.stage==='delivered'&&balance(o)===0?button('完成订单','completeOrder',id,'primary','check'):'');
modal(T('订单详情','Order details')+' · '+id,`<div class="between wrap"><div><h2>${e(portal&&U.lang==='en'?c.en:c.name)}</h2><p class="small muted">${T('确认日期','Confirmed')} ${niceDate(o.date)} · ${T('负责人','Contact')} ${e(roleName(o.owner))}</p></div><div class="flex">${orderPill(o)}${moneyVisible()?paymentPill(o):''}</div></div><div class="ordertrack">${[T('收定 / 确认','Deposit'),T('生产备货','Production'),T('待发运','Ready'),T('运输中','In transit'),T('已签收','Delivered')].map((x,i)=>`<div class="step ${i<=idx?'done':''} ${i===idx?'current':''}"><i>${i<idx?'✓':i+1}</i>${x}</div>`).join('')}</div><div class="kvgrid">${moneyVisible()?kv(T('订单总额','Order total'),`<strong style="font-size:20px">${money(o.total,o.currency)}</strong>`)+kv(T('已核实回款','Confirmed payments'),`<strong style="font-size:20px;color:var(--primary)">${money(paid(o),o.currency)}</strong>`)+kv(T('未结余额','Balance due'),`<strong style="font-size:20px;color:${balance(o)>0?'var(--amber)':'var(--primary)'}">${money(balance(o),o.currency)}</strong>`):''}${kv(T('预计交付','Expected delivery'),niceDate(o.eta))}${kv(T('预付款条件','Deposit requirement'),o.depositPct+'%'+(moneyVisible()?' / '+money(deposit(o),o.currency):''))}${kv(T('尾款到期','Balance due date'),niceDate(o.balanceDue))}</div>${o.stage==='not_started'?`<div class="mt">${notice(canRelease(o)?T('已达到约定预付款条件，等待内部释放生产。','Deposit requirement met. Awaiting internal production release.'):T('当前尚未满足生产释放条件。只有财务核实并核销的到账款才计入预付款。','Production remains on hold until the required deposit has been verified and allocated.'),canRelease(o)?'success':'warning')}</div>`:''}${!portal&&pendingAmount>0?`<p class="small muted" style="margin-top:10px">另有 ${money(pendingAmount,o.currency)} 待财务核实，不计入已收金额。</p>`:''}<h3 class="mt" style="margin-bottom:12px">${T('订单商品快照','Order item snapshot')}</h3>${lineTable(o.items,o.currency,moneyVisible())}<h3 class="mt" style="margin-bottom:13px">${T('物流与交付','Shipping and delivery')}</h3><div class="kvgrid">${kv(T('运输方式','Shipping method'),e(o.carrier||T('尚未发运','Not shipped')))}${kv(T('运单 / 提单号','Tracking / BOL'),e(o.tracking||'—'))}${kv(T('柜号','Container number'),e(o.container||'—'))}</div>${moneyVisible()?`<h3 class="mt" style="margin-bottom:12px">${T('回款记录','Payment history')}</h3>${table([T('日期','Date'),T('收款编号','Receipt'),T('金额','Amount'),T('状态','Status')],rec.map(r=>tr([niceDate(r.date),e(r.id),money(r.amount,r.currency),pill(r.status==='verified'?T('已核实并核销','Verified & allocated'):T('待核实','Pending verification'),r.status==='verified'?'green':'amber')])))} `:''}${!portal?`<h3 class="mt" style="margin-bottom:12px">内部业务时间线</h3><div class="timelinelist">${[...o.history.slice().reverse().map(h=>({text:h.text,at:h.at,actor:h.actor})),...f.slice().reverse().map(h=>({text:h.summary,at:h.at,actor:roleName(h.actor)}))].slice(0,9).map(h=>`<div class="tl"><i class="node"></i><div><div class="text">${e(h.text)}</div><div class="time">${niceDate(h.at,true)} · ${e(h.actor)}</div></div></div>`).join('')}</div>`:''}`,actions,'wide')}
function quoteRisk(q){let reasons=[];const rate=q.currency==='USD'?7.1:1;if(q.total*rate>=10000000)reasons.push('金额达到特别审批阈值');if(q.items.some(i=>i.price<(i.listPrice||i.price)*.9))reasons.push('折扣超出常规范围');const cost=q.items.reduce((a,i)=>a+Math.round((i.cost??prod(i.product)?.cost??0)/rate)*i.qty,0);if(q.total>0&&(q.total-cost)/q.total<.2)reasons.push('需要受限核价复核');if(q.depositPct<30)reasons.push('预付款条件例外');return reasons}
function quoteDetail(id){const q=findQuote(id);const portal=U.mode==='portal';if(!q||!visibleRow(q)||(!portal&&!canQuote())||(portal&&(!q.published||!['approved','accepted'].includes(q.status))))return accessError();const c=cust(q.customer);let acts=button(T('关闭','Close'),'close');if(['approved','accepted'].includes(q.status)){acts+=button(T('正式报价单','Quotation document'),'printQuote',id,'','print');if(!portal&&q.status==='approved'&&!q.published)acts+=button('发布给客户','publishQuote',id,'primary','send');if(portal&&q.status==='approved'&&new Date(q.valid+'T23:59:59+08:00')>=now())acts+=button(T('接受报价','Accept quote'),'acceptQuote',id,'primary','check');}
if(!portal&&q.status==='pending'&&q.approvers[q.step]===U.role){acts+=button('退回','approvalReject',id,'danger')+button('审批通过','approvalApprove',id,'primary','check')}
if(!portal&&q.status==='draft'){acts+=button('编辑草稿','editQuote',id,'','edit')+button('提交审批','submitQuote',id,'primary','send')}
if(!portal&&['rejected','approved'].includes(q.status))acts+=button('创建新版本','reviseQuote',id,'','edit');
const approv=q.approvers.length?`<div class="flex wrap" style="margin:12px 0">${q.approvers.map((a,i)=>`<div class="flex">${i?icon('arrow'):''}${pill(roleName(a)+' · '+(i<q.step?'已通过':i===q.step&&q.status==='pending'?'待审批':q.status==='rejected'?'已退回':'待流转'),i<q.step?'green':i===q.step?'amber':'')}</div>`).join('')}</div>`:'';
modal(T('报价详情','Quotation details')+' · '+id,`<div class="between wrap"><div><h2>${e(portal&&U.lang==='en'?c.en:c.name)}</h2><p class="small muted">V${q.revision} · ${niceDate(q.date)} · ${q.currency}</p></div>${pill(...quoteStatus(q))}</div><div class="divider"></div><div class="kvgrid">${kv(T('报价总额','Quoted total'),`<strong style="font-size:24px">${money(q.total,q.currency)}</strong>`)}${kv(T('有效期至','Valid until'),niceDate(q.valid))}${kv(T('预计交期','Expected delivery'),niceDate(q.eta))}${kv(T('预付款条件','Deposit'),q.depositPct+'% / '+money(deposit(q),q.currency))}${kv(T('业务负责人','Your sales contact'),e(roleName(q.owner)))}${kv(T('对客状态','Publication'),q.published?T('已发布','Published'):T('尚未发布','Not published'))}</div><h3 class="mt" style="margin-bottom:12px">${T('报价明细','Items')}</h3>${lineTable(q.items,q.currency)}<div class="quote-total"><div><span class="small muted">${T('商品合计 · 演示无额外税费/运费','Total · No additional tax or shipping in this demo')}</span></div><strong>${money(q.total,q.currency)}</strong></div><div class="mt">${kv(T('对客说明','Customer notes'),e(q.note||'—'))}</div>${!portal?`<h3 class="mt">审批流程</h3>${approv||notice('当前为草稿。提交时由规则生成审批链，提交人不能审批自己的版本。')}<p class="small muted">提交人：${e(roleName(q.submittedBy||q.createdBy))} · ${quoteRisk(q).length?'触发特别审批：'+e(quoteRisk(q).join('；')):'常规审批：至少一名非本人审批者'}</p>${costVisible()&&q.currency==='USD'?'<p class="small muted" style="font-size:10px;margin-top:5px">本演示核价换算：1 USD = 7.10 CNY，仅为样例，不是实时汇率。</p>':''}${q.approvalLog.length?`<div class="timelinelist mt">${q.approvalLog.map(a=>`<div class="tl"><i class="node"></i><div><div class="text">${e(roleName(a.actor))} · ${e(a.decision)}：${e(a.note)}</div><div class="time">${niceDate(a.at,true)}</div></div></div>`).join('')}</div>`:''}`:''}`,acts,'wide')}
function quoteDocument(q){const c=q.customerSnapshot||cust(q.customer);return `<article class="docsheet"><div class="between"><div><div class="doclogo">CRM销售管理系统</div><div class="small muted">企业采购服务 · 正式报价</div></div><div class="alignright"><div class="doctitle">QUOTATION</div><span class="small muted">正式报价单 · ${e(q.id)} · V${q.revision}</span></div></div><div class="docline"></div><div class="grid2"><div><span class="small muted">TO / 客户</span><h3 style="margin-top:6px">${e(c.name)}</h3><p class="small muted">${e(c.contact)} · ${e(c.email)}</p><p class="small muted">${e(c.address)}</p></div><div class="alignright small"><p>报价日期：${niceDate(q.date)}</p><p>有效期至：${niceDate(q.valid)}</p><p>结算币种：${q.currency}</p><p>预计交期：${niceDate(q.eta)}</p></div></div><div style="margin-top:28px">${table(['商品 / SKU','数量','单价','金额'],q.items.map(i=>tr([`${e(i.name)}<div class="secondary">${e(i.sku)} · ${e(i.spec)}</div>`,i.qty,money(i.price,q.currency),money(i.price*i.qty,q.currency)])))}</div><div class="alignright" style="margin-top:20px"><span class="muted">合计 TOTAL　</span><strong style="font-size:27px;color:var(--primary)">${money(q.total,q.currency)}</strong></div><div class="divider"></div><h3>付款与交付约定</h3><p class="small" style="margin-top:10px">预付款 ${q.depositPct}%（${money(deposit(q),q.currency)}）；尾款约定于 ${niceDate(addDays(q.eta,7))} 支付（本演示：预计交付后7天）。示例报价无额外税费/运费项目，实际交易须在正式系统确认口径。</p><p class="small" style="margin-top:8px">客户说明：${e(q.note||'—')}</p><div class="between wrap" style="margin-top:30px"><div class="docstamp">审批通过版本 · 专属客户报价</div><span class="small muted">专属业务：${e(roleName(q.owner))}</span></div><p class="small muted" style="margin-top:25px;border-top:1px solid #edf1ef;padding-top:12px;font-size:10px">演示样例 · 虚构商品与客户 · 不具有真实交易或合同效力。此文件只用于产品演示，不包含真实收款账户。</p></article>`}
function printQuote(id){const q=findQuote(id);if(!q||!visibleRow(q)||!['approved','accepted'].includes(q.status)||(U.mode==='portal'&&!q.published))return accessError();modal(T('正式报价单预览','Quotation preview'),quoteDocument(q),`<span class="muted">${T('浏览器打印可选择“另存为PDF”。','Choose “Save as PDF” in your browser print dialog.')}</span>${button(T('关闭','Close'),'close')}${button(T('下载明细 CSV','Download items CSV'),'quoteCSV',id,'','down')}${button(T('打印 / 另存 PDF','Print / Save PDF'),'print','','primary','print')}`,'wide')}
function inquiryDetail(id){const q=S.inquiries.find(x=>x.id===id);if(!q||!visibleRow(q))return accessError();const c=cust(q.customer);modal(T('申请详情','Request details')+' · '+q.id,`<div class="kvgrid">${kv(T('公司','Company'),e(U.lang==='en'?c.en:c.name))}${kv(T('申请类型','Type'),q.type==='order_request'?T('订单申请','Order request'):T('询价申请','Inquiry'))}${kv(T('需求交期','Requested date'),niceDate(q.eta))}${kv(T('负责人','Sales contact'),e(roleName(q.owner)))}${kv(T('提交日期','Submitted'),niceDate(q.date))}${kv(T('状态','Status'),pill(q.status==='new'?T('待受理','Under review'):T('已生成报价','Quoted'),q.status==='new'?'amber':'green'))}</div><h3 class="mt" style="margin-bottom:12px">${T('申请商品','Requested products')}</h3>${lineTable(q.items,q.currency,false)}<div class="mt">${kv(T('需求说明','Requirements'),e(q.note||'—'))}</div><div class="mt">${notice(T('申请不是正式订单，不自动锁库存或进入生产。业务将确认价格与条款并完成报价审批。','This request is not a confirmed order. Pricing and terms will be reviewed before stock reservation or production.'))}</div>`,button(T('关闭','Close'),'close')+(U.mode==='internal'&&canQuote()&&q.status==='new'?button('从申请生成报价','quoteFromInquiry',id,'primary','plus'):''))}
function contractDetail(id){const c=S.contracts.find(x=>x.id===id);const o=c&&findOrder(c.order);if(!canSeeOrder(o))return accessError();modal('合同档案 · '+c.id,`<div class="docsheet"><div class="between"><div class="doclogo">CRM销售管理系统</div>${pill(c.status==='signed'?'已登记签署（样例）':'待签署',c.status==='signed'?'green':'amber')}</div><div class="docline"></div><h2 style="text-align:center;margin:20px 0">${e(c.title)}</h2><div class="kvgrid">${kv('合同编号',e(c.id))}${kv('当前版本','V'+c.version)}${kv('客户',e(cust(o.customer).name))}${kv('关联订单',e(o.id))}${kv('合同金额',money(o.total,o.currency))}${kv('有效期至',niceDate(c.valid))}</div><div class="divider"></div><h3>档案与版本管理</h3><p class="small" style="margin-top:10px">本页展示合同台账和业务关联，不包含真实签署文件。正式系统应保留每一版合同、签署附件、补充协议与访问记录，签署原件不得覆盖。</p><div class="mt">${notice('样例文件 · 无真实公章或签名 · 不具有法律或交易效力。')}</div><div class="mt">${kv('付款条件',`预付 ${o.depositPct}%（${money(deposit(o),o.currency)}），尾款约定于 ${niceDate(o.balanceDue)} 到期。`)}</div><div class="mt">${kv('历史版本',Array.from({length:c.version},(_,i)=>'V'+(i+1)+(i===c.version-1?' · 当前版本':' · 历史归档')).join('　 /　 '))}</div></div>`,button('关闭','close')+button('打印档案样例','print','','','print')+(c.status==='pending'&&canQuote()?button('模拟登记签署','signContract',c.id,'primary','check'):''))}
function receiptDetail(id){const r=S.receipts.find(x=>x.id===id);if(!r||!canSeeOrder(findOrder(r.order)))return accessError();modal('回款记录 · '+r.id,`<div class="kvgrid">${kv('关联订单',e(r.order))}${kv('登记金额',money(r.amount,r.currency))}${kv('到账日期',niceDate(r.date))}${kv('交易流水号',e(r.transaction))}${kv('当前状态',pill(r.status==='verified'?'已核实并核销':'待核实',r.status==='verified'?'green':'amber'))}${kv('录入人',e(r.actor))}</div><div class="mt">${kv('登记说明',e(r.note))}</div><div class="mt">${notice('这是本机样例记录；未连接银行，也不生成真实财务凭证。')}</div>`,button('关闭','close')+(U.role==='finance'&&r.status==='pending'?button('核实到账','verifyReceipt',r.id,'primary','check'):''),'narrow')}
function help(){modal(T('演示说明','About this demo'),`<div class="introcard"><div><div class="eyebrow">PRODUCT DEMO / V2.0</div><h2>${T('CRM销售管理系统','CRM销售管理系统')}</h2><p>${T('展示从产品报价、审批、订单履约到回款与客户维护的核心业务。','Explore quotations, approvals, order fulfillment, payments and customer follow-ups.')}</p></div></div><div class="mt">${notice(T('所有品牌、客户、联系方式、金额和文件均为虚构样例，请勿录入真实客户、成本或银行资料。','All brands, customers, contacts, amounts and documents are fictional. Do not enter real customer, cost or banking information.'),'warning')}</div><div class="stack mt"><div><h3>${T('可以体验什么','What works')}</h3><p class="small muted">${T('角色切换、产品/客户搜索、申请提交、报价新建与审批、客户确认转订单、预付款核实、生产/发运操作、跟进记录、提醒扫描去重、规则保存、CSV导出与报价打印。','Switch roles, search records, submit requests, create and approve quotes, accept quotes into orders, verify deposits, update fulfillment, log follow-ups, scan reminders, save rules, export CSV and print quotations.')}</p></div><div><h3>${T('边界与安全','Limits and security')}</h3><p class="small muted">${T('纯前端、离线、本机存储；角色选择器不是认证，源码中包含全部样例数据。未接入数据库、邮件、微信、飞书、银行或物流。提醒只在点击模拟扫描时生成；文件生成采用浏览器打印。','This is a local, offline front-end demo. Role switching is not authentication. All sample data is in the source. There is no database, email, banking, messaging or logistics integration. Reminders run only when you click Scan; documents use browser printing.')}</p></div><div><h3>${T('如何恢复演示','Resetting the demo')}</h3><p class="small muted">${T('设置页可恢复到初始样例。当前时钟为 '+niceDate(S.now,true)+'，不是真实系统时间。浏览器允许时，更改会保存在本机localStorage。','Use Reset in Settings to restore sample data. The demo clock is '+niceDate(S.now,true)+', not real time. Changes are stored locally when the browser permits.')}</p></div></div>`,button(T('关闭','Close'),'close')+button(T('选择演示路线','Choose a walkthrough'),'guide','','primary','play'))}
function guide(){modal('快速演示 · 选择一条业务路线',`<p class="small muted mb">以下入口会切换到合适的演示身份，不会产生真实交易。关键表单、审批和状态变更可以实际操作。</p><div class="guidegrid">${[['overview','01 / OVERVIEW','经营总览与客户档案','查看订单金额、回款、客户年度小结与异常跟进。'],['customer','02 / SELF-SERVICE','客户门户与自助申请','选商品、改数量、提交询价或订单申请；返回销售端受理。'],['approval','03 / QUOTE TO ORDER','报价与审批流转','以林悦销售身份创建报价，切换张宁销售经理进行审批。'],['payment','04 / FULFILLMENT','预付款到订单交付','先核实待处理收款，再切生产/仓储身份释放生产与发运。'],['reminder','05 / FOLLOW-UP','跟进与自动提醒逻辑','模拟扫描两次验证去重，再记录有效跟进并查看逾期变化。'],['permission','06 / ACCESS','共享资料与成本权限','先用经营身份看成本，再切销售人员验证展示与数据范围变化。']].map(([id,no,title,desc])=>`<button class="guidecard" data-action="walkthrough" data-id="${id}"><span>${no}</span><h3>${title}</h3><p>${desc}</p></button>`).join('')}</div>`,button('关闭','close'),'wide')}
function customerForm(){if(!canFollow())return accessError();modalState={kind:'customer'};modal('新增客户档案',`<form id="customerForm" data-form="customer"><div class="formgrid">${field('公司名称 *','name','','text','required maxlength="80"')}${field('英文名称（可选）','en','','text','maxlength="100"')}${field('联系人 *','contact','','text','required maxlength="40"')}${field('电子邮箱 *','email','','email','required maxlength="120"')}${field('联系电话','phone','','text','maxlength="40"')}<div class="field"><label for="f-country">客户地区 *</label><select name="country" id="f-country" required><option>中国大陆</option><option>中国香港</option><option>新加坡</option><option>德国</option><option>美国</option><option>其他</option></select></div><div class="field"><label for="f-owner">负责人 *</label><select name="owner" id="f-owner">${(isSales()?[U.role]:['sales','sales2']).map(r=>`<option value="${r}">${roleName(r)}</option>`).join('')}</select></div><div class="field"><label for="f-currency">默认币种</label><select name="currency" id="f-currency"><option>CNY</option><option>USD</option></select></div><div class="full">${field('收货地址','address','','text','maxlength="200"')}</div></div><div class="mt">${notice('新增档案默认为未成交，成交状态由正式订单自动推导。此处仅保存虚构演示数据。')}</div></form>`,button('取消','close')+submitButton('创建客户档案','customerForm'),'narrow')}
function productForm(){if(!['owner','manager'].includes(U.role))return accessError();modalState={kind:'product'};modal('新增产品',`<form id="productForm" data-form="product"><div class="formgrid">${field('产品名称 *','name','','text','required maxlength="60"')}${field('英文名称 *','en','','text','required maxlength="100"')}${field('SKU *','sku','','text','required maxlength="35" pattern="[A-Za-z0-9_-]+"')}${field('规格说明 *','spec','','text','required maxlength="100"')}<div class="field"><label for="f-category">产品分类</label><select id="f-category" name="category"><option>日用礼品</option><option>商务出行</option><option>办公文具</option><option>包装配套</option></select></div>${field('起订量（件）*','moq','100','number','required min="1" max="1000000" step="1"')}${field('人民币销售单价 *','price','48.00','text','required inputmode="decimal"')}${field('美元销售单价 *','usd','6.80','text','required inputmode="decimal"')}${costVisible()?field('人民币成本（受限）*','cost','','text','required inputmode="decimal"'):''}${field('常规交期（天）*','lead','10','number','required min="1" max="365"')}${field('安全库存（件）','safe','100','number','required min="0" max="1000000"')}</div><div class="mt">${notice('新产品初始库存为0，库存需由生产/仓储通过流水录入。销售经理建品后，成本须由授权经营人员维护。')}</div></form>`,button('取消','close')+submitButton('创建产品','productForm'))}
function costForm(id){if(!costVisible())return accessError();const p=prod(id);modalState={kind:'cost',id};modal('维护受限成本 · '+p.name,`<form id="costForm" data-form="cost"><div class="formgrid">${field('采购成本（CNY / 件）*','cost',p.cost==null?'':dec(p.cost),'text','required inputmode="decimal"')}${field('变更依据 *','reason','','text','required minlength="5" maxlength="200"')}</div><div class="mt">${notice('新值仅用于后续核价；已提交/已发布报价的成本快照不被覆盖。受限变更日志不向普通销售开放。')}</div></form>`,button('取消','close')+submitButton('保存成本','costForm'),'narrow')}
function followForm(arg){if(!canFollow())return accessError();const [type,id]=arg.split('|');const obj=type==='customer'?cust(id):type==='quote'?findQuote(id):findOrder(id);if(!obj||(type==='customer'?!visibleCustomer(obj):!visibleRow(obj)))return accessError();if(type==='order'&&obj.status!=='confirmed'){toast('已结束订单不再记录当前跟进周期，请维护客户档案。','error');return}modalState={kind:'follow',type,id};const c=type==='customer'?obj:cust(obj.customer);const future=niceDate(addDays(S.now,type==='customer'?(trade(c)?S.rules.customerActive:S.rules.customerProspect):S.rules.orderDays),true).replace(' ','T');modal('记录'+(type==='customer'?'客户维护':type==='quote'?'报价跟进':'订单跟进'),`<form id="followForm" data-form="follow"><div class="notice success">${icon('edit')}<div>${e(c.name)}<br><span class="small">${e(id)} · 仅有效沟通会重置对应对象的跟进周期</span></div></div><div class="formgrid mt"><div class="field"><label for="f-channel">沟通方式 *</label><select name="channel" id="f-channel"><option>电话</option><option>邮件</option><option>即时消息</option><option>拜访</option><option>视频会议</option></select></div>${field('实际发生时间 *','occurred',niceDate(S.now,true).replace(' ','T'),'datetime-local','required')}<div class="field full"><label for="f-summary">沟通摘要与下一步动作 *</label><textarea id="f-summary" name="summary" required minlength="5" maxlength="1000" placeholder="例如：已确认交期，客户将于周五安排尾款，届时再次确认。"></textarea></div><div class="full">${field('下次计划跟进 *','next',future,'datetime-local','required')}</div>${type!=='customer'?'<label class="flex full small" style="align-items:flex-start"><input type="checkbox" name="syncCustomer" style="margin-top:5px">同步为一次客户维护（确实与客户沟通时勾选；单纯内部生产进度更新不应同步）</label>':''}</div><div class="mt">${notice('补录早于最近一次联系的记录只补充历史，不覆盖较新的联系时间或重置计划。通知已读不等于完成跟进。')}</div></form>`,button('取消','close')+submitButton('保存有效跟进','followForm'),'narrow')}
function quoteRowsHTML(){return `<div class="lineedit header"><span>产品 / SKU</span><span>数量</span><span>成交单价</span><span></span></div>${modalState.rows.map((r,i)=>`<div class="lineedit"><select name="product${i}" data-qproduct="${i}" aria-label="第${i+1}行商品">${S.products.map(p=>`<option value="${p.id}" ${p.id===r.product?'selected':''}>${e(p.name)} · ${p.sku}</option>`).join('')}</select><input name="qty${i}" value="${r.qty}" type="number" required min="1" max="1000000" step="1" data-qcalc aria-label="第${i+1}行数量"><input name="price${i}" value="${dec(r.price)}" type="text" inputmode="decimal" required data-qcalc aria-label="第${i+1}行单价"><button class="btn iconbtn" type="button" data-action="removeQuoteLine" data-id="${i}" aria-label="移除第${i+1}行">${icon('close')}</button></div>`).join('')}`}
function syncQuoteRows(){if(modalState?.kind!=='quote')return;const form=document.getElementById('quoteForm');modalState.rows=modalState.rows.map((r,i)=>({product:form.elements['product'+i]?.value||r.product,qty:Number(form.elements['qty'+i]?.value||0),price:parseMoney(form.elements['price'+i]?.value||'0')}))}
function calcQuote(){const form=document.getElementById('quoteForm');if(!form)return;syncQuoteRows();const total=modalState.rows.reduce((a,r)=>a+(Number.isFinite(r.price)?r.price*r.qty:0),0);const el=document.getElementById('quoteLiveTotal');if(el)el.textContent=money(total,form.elements.currency.value)}
function quoteForm({source=null,edit=null,revise=null}={}){if(!canQuote())return accessError();let c=source?cust(source.customer):edit?cust(edit.customer):revise?cust(revise.customer):customers()[0];if(!c){toast('请先创建客户档案。','error');return}const base=edit||revise;modalState={kind:'quote',source:source?.id,edit:edit?.id,revise:revise?.id,rows:deep(base?.items||source?.items||[{product:S.products[0].id,qty:S.products[0].moq,price:c.currency==='USD'?S.products[0].usd:S.products[0].price}])};const cur=base?.currency||source?.currency||c.currency;modal(''+(edit?'编辑报价草稿':revise?'创建新报价版本':'新建报价'),`<form id="quoteForm" data-form="quote"><div class="formgrid"><div class="field"><label for="q-customer">客户 *</label><select name="customer" id="q-customer">${customers().map(x=>`<option value="${x.id}" ${c.id===x.id?'selected':''}>${e(x.name)}</option>`).join('')}</select></div><div class="field"><label for="q-currency">结算币种 *</label><select name="currency" id="q-currency" data-change="quoteCurrency"><option value="CNY" ${cur==='CNY'?'selected':''}>CNY 人民币</option><option value="USD" ${cur==='USD'?'selected':''}>USD 美元</option></select></div>${field('报价有效期至 *','valid',base?.valid||dayStr(addDays(S.now,14)),'date','required')}${field('预计交付日期 *','eta',base?.eta||source?.eta||dayStr(addDays(S.now,25)),'date','required')}${field('预付款比例（%）*','depositPct',base?.depositPct??30,'number','required min="0" max="100" step="1"')}</div><h3 class="mt" style="margin-bottom:9px">商品明细</h3><div id="quoteLines">${quoteRowsHTML()}</div>${button('添加商品行','addQuoteLine','','sm soft','plus')}<div class="quote-total"><span class="small muted">商品合计 · 演示无额外税费/运费</span><strong id="quoteLiveTotal">${money(modalState.rows.reduce((a,r)=>a+r.qty*r.price,0),cur)}</strong></div><div class="field mt"><label for="q-note">对客说明 / 包装与交付要求</label><textarea name="note" id="q-note" maxlength="800">${e(base?.note||source?.note||'')}</textarea></div><div class="mt">${notice('先保存草稿，再提交审批。审批通过才可发布正式报价；普通销售不会看到成本或毛利。商品行数量需满足对应起订量。')}</div></form>`,button('取消','close')+submitButton('保存草稿','quoteForm'),'wide')}
function approvalForm(id,approve){const q=findQuote(id);if(!q||q.status!=='pending'||q.approvers[q.step]!==U.role||!visibleRow(q)||(q.submittedBy||q.createdBy)===U.role)return accessError();modalState={kind:'approval',id,approve};modal(approve?'确认审批通过':'退回报价修改',`<form id="approvalForm" data-form="approval"><div class="kvgrid">${kv('报价版本',e(q.id)+' · V'+q.revision)}${kv('报价总额',money(q.total,q.currency))}${kv('当前节点',e(roleName(U.role)))}</div><div class="field mt"><label for="f-note">${approve?'审批意见（建议填写）':'退回原因 *'}</label><textarea id="f-note" name="note" ${approve?'':'required minlength="3"'} maxlength="600" placeholder="${approve?'已核对数量、交期和付款条件，同意本版本。':'请明确需要调整的商品、价格或条款。'}"></textarea></div><div class="mt">${notice(approve?'本次决定只对当前冻结版本有效。若仍有后续节点，将继续流转；全部通过后才允许发布。':'退回后保留当前版本和审批记录，业务需要创建新版本再提交。')}</div></form>`,button('取消','close')+submitButton(approve?'确认通过':'确认退回','approvalForm'),'narrow')}
function receiptForm(id=''){if(U.mode!=='internal'||!['finance','owner','manager','sales','sales2'].includes(U.role))return accessError();const opts=orders().filter(o=>balance(o)>0&&o.status==='confirmed');if(!opts.length){toast('当前没有未结清的可登记订单。','error');return}let o=opts.find(x=>x.id===id)||opts[0];modalState={kind:'receipt'};modal(U.role==='finance'?'登记并核实回款（演示）':'提交回款线索',`<form id="receiptForm" data-form="receipt"><div class="formgrid"><div class="field full"><label for="f-order">关联订单 *</label><select name="order" id="f-order" data-change="receiptOrder">${opts.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${e(x.id)} · ${e(cust(x.customer).name)} · ${x.currency}</option>`).join('')}</select></div>${field('到账金额 *','amount',dec(Math.min(balance(o),Math.max(0,deposit(o)-paid(o))||balance(o))),'text','required inputmode="decimal"')}${field('到账日期 *','date',dayStr(),'date','required')}${field('银行 / 付款交易号 *','transaction','','text','required maxlength="80"')}${field('收款说明 *','note','','text','required minlength="3" maxlength="300"')}</div><div id="receiptBalance" class="mt">${notice(`当前未结余额 ${money(balance(o),o.currency)}。同一交易号不能重复登记。`,'success')}</div><label class="flex small mt" style="align-items:flex-start"><input type="checkbox" name="confirmed" required style="margin-top:5px">${U.role==='finance'?'确认这是模拟核实操作，金额/交易号/订单已核对；不代表真实银行到账。':'确认仅提交待核实信息，不直接改变订单已收或生产条件。'}</label></form>`,button('取消','close')+submitButton(U.role==='finance'?'登记并核实':'提交待财务核实','receiptForm'),'narrow')}
function confirmVerify(id){const r=S.receipts.find(x=>x.id===id);const o=r&&findOrder(r.order);if(U.role!=='finance'||!r||!canSeeOrder(o)||r.status!=='pending')return accessError();if(r.amount>balance(o)){toast('该金额超过订单当前未结余额，请先核对重复付款或分配差异。','error');return}modal('核实到账 · '+r.id,`<div class="kvgrid">${kv('订单',e(o.id))}${kv('金额',money(r.amount,r.currency))}${kv('交易号',e(r.transaction))}</div><div class="mt">${notice('仅用于演示：确认后会把此笔样例回款核销到订单，更新已收金额；达到预付款门槛后允许生产释放。','warning')}</div>`,button('取消','close')+button('确认核实并核销','doVerifyReceipt',id,'primary','check'),'narrow')}
function newContract(){if(!canQuote())return accessError();const os=orders().filter(o=>o.status==='confirmed');if(!os.length){toast('暂无可关联合同的正式订单。','error');return}modalState={kind:'contract'};modal('创建合同档案',`<form id="contractForm" data-form="contract"><div class="formgrid"><div class="field full"><label for="f-order">关联订单 *</label><select name="order" id="f-order">${os.map(o=>`<option value="${o.id}">${e(o.id)} · ${e(cust(o.customer).name)}</option>`).join('')}</select></div><div class="full">${field('合同名称 *','title','商品采购合同','text','required maxlength="60"')}</div>${field('有效期至 *','valid',dayStr(addDays(S.now,90)),'date','required')}</div><div class="mt">${notice('创建待签署的档案样例，金额和客户由关联订单带入。本Demo不上传真实签署附件。')}</div></form>`,button('取消','close')+submitButton('创建待签署档案','contractForm'),'narrow')}
function inventoryForm(){if(U.role!=='warehouse')return accessError();modalState={kind:'inventory'};modal('登记库存调整',`<form id="inventoryForm" data-form="inventory"><div class="formgrid"><div class="field full"><label for="f-product">商品 *</label><select name="product" id="f-product">${S.products.map(p=>`<option value="${p.id}">${e(p.name)} · ${p.sku} · 可用 ${available(p)}件</option>`).join('')}</select></div><div class="field"><label for="f-direction">调整方向</label><select name="direction" id="f-direction"><option value="in">入库增加</option><option value="out">盘亏减少</option></select></div>${field('调整数量（件）*','qty','100','number','required min="1" max="1000000" step="1"')}<div class="full">${field('调整依据 / 原因 *','reason','','text','required minlength="5" maxlength="200"')}</div></div><div class="mt">${notice('演示采用单仓成品台账，调整会生成流水。不能扣减已经为其他订单预留的库存。正式系统的盘亏等异常调整应进入授权审批。')}</div></form>`,button('取消','close')+submitButton('确认登记流水','inventoryForm'),'narrow')}
function advanceOrder(id){const o=findOrder(id);if(U.role!=='warehouse'||!canSeeOrder(o)||o.status!=='confirmed')return accessError();if(o.stage==='not_started'){if(!canRelease(o)){toast('尚未达到已核实预付款门槛，请由财务核实并核销回款。','error');return}modal('确认释放生产',notice(`订单 ${e(o.id)} 已满足预付款门槛。此演示操作会创建订单级生产状态，不会连接真实工厂。`),button('取消','close')+button('确认释放生产','doAdvance',id,'primary'),'narrow');return}if(o.stage==='producing'){modal('完成生产并登记入库',notice('本次演示按整单完成：增加对应成品库存并为该订单预留，然后进入待发运。正式平台应按实际完成数量分批登记。')+`<div class="mt">${lineTable(o.items,o.currency,false)}</div>`,button('取消','close')+button('确认完成并入库','doAdvance',id,'primary'),'narrow');return}if(o.stage==='ready'){modalState={kind:'shipment',id};modal('登记发运 · '+id,`<form id="shipmentForm" data-form="shipment"><div class="formgrid"><div class="field"><label for="f-method">运输方式 *</label><select name="method" id="f-method"><option value="express">快递 / 陆运</option><option value="sea">海运</option><option value="pickup">自提</option></select></div>${field('承运商 / 提货方 *','carrier','','text','required maxlength="60"')}${field('运单 / 提单 / 自提单号 *','tracking','','text','required maxlength="80"')}${field('柜号（海运必填）','container','','text','maxlength="60"')}${field('预计到达 *','eta',o.eta<dayStr()?dayStr(addDays(S.now,3)):o.eta,'date','required')}</div><div class="mt">${notice('本Demo按整单发运并扣减预留库存，正式系统支持分批出货与多运单。数量和库存将在提交前再次校验。')}</div></form>`,button('取消','close')+submitButton('确认出库并发运','shipmentForm'),'narrow');return}if(o.stage==='shipped'){modalState={kind:'delivery',id};modal('登记签收 · '+id,`<form id="deliveryForm" data-form="delivery"><div class="formgrid">${field('实际签收日期 *','date',dayStr(),'date','required')}${field('签收依据 / 说明 *','note','','text','required minlength="3" maxlength="200"')}</div><div class="mt">${notice('签收后仅更新交付状态。若尾款未结清，订单依然不能标记为完成。')}</div></form>`,button('取消','close')+submitButton('确认整单签收','deliveryForm'),'narrow')}}
function profileForm(){if(U.mode!=='portal')return accessError();const c=cust(U.customer);modalState={kind:'profile'};modal(T('修改联系资料','Edit contact details'),`<form id="profileForm" data-form="profile"><div class="formgrid">${field(T('联系人 *','Contact *'),'contact',c.contact,'text','required maxlength="50"')}${field(T('电子邮箱 *','Email *'),'email',c.email,'email','required maxlength="120"')}${field(T('联系电话','Phone'),'phone',c.phone,'text','maxlength="50"')}<div class="full">${field(T('收货地址 *','Delivery address *'),'address',c.address,'text','required maxlength="200"')}</div></div></form>`,button(T('取消','Cancel'),'close')+submitButton(T('保存资料','Save details'),'profileForm'),'narrow')}
function basket(){if(U.mode!=='portal')return accessError();if(!U.basket.length){toast(T('请先选择商品。','Please add a product first.'),'error');return}const c=cust(U.customer);modalState={kind:'basket'};modal(T('提交采购需求','Submit purchase request'),`<form id="basketForm" data-form="basket"><div class="between"><h3>${T('申请商品','Requested products')}</h3><span class="small muted">${c.currency} · ${T('参考价，非正式报价','Reference prices only')}</span></div>${U.basket.map(x=>{const p=prod(x.product);return `<div class="basketline"><div class="mini-product">${art(p,true)}</div><div><h4>${e(U.lang==='en'?p.en:p.name)}</h4><div class="small muted" style="font-size:10px">${p.sku} · MOQ ${p.moq}</div></div><input name="qty-${p.id}" type="number" step="1" min="${p.moq}" max="1000000" value="${x.qty}" required data-bqty="${p.id}" aria-label="${e(p.name)}数量"><span class="lineamount small">${money((c.currency==='USD'?p.usd:p.price)*x.qty,c.currency)}</span><button type="button" class="linkbtn" data-action="removeBasket" data-id="${p.id}" aria-label="移除商品">${icon('close')}</button></div>`}).join('')}<div class="formgrid mt"><div class="field"><label for="f-type">${T('申请类型','Request type')}</label><select name="type" id="f-type"><option value="order_request">${T('订单申请','Order request')}</option><option value="inquiry">${T('询价申请','Quotation request')}</option></select></div>${field(T('期望交付日期 *','Requested delivery date *'),'eta',dayStr(addDays(S.now,25)),'date','required')}<div class="full">${field(T('收货地址 *','Delivery address *'),'address',c.address,'text','required maxlength="200"')}</div><div class="field full"><label for="f-note">${T('定制、包装或其他要求','Customization, packaging or other requirements')}</label><textarea name="note" id="f-note" maxlength="800"></textarea></div></div><div class="mt">${notice(T('提交后由专属业务核对价格和交期，完成报价审批与客户确认后才生成正式订单。此Demo不会产生真实交易。','Your sales representative will review pricing and delivery. A confirmed order is created only after quotation approval and acceptance. No real transaction is created.'))}</div></form>`,button(T('取消','Cancel'),'close')+submitButton(T('提交申请','Submit request'),'basketForm'),'wide')}
function confirmAccept(id){const q=findQuote(id);if(U.mode!=='portal'||!q||q.customer!==U.customer||!q.published||q.status!=='approved')return accessError();if(new Date(q.valid+'T23:59:59+08:00')<now()){toast(T('报价已过期，请联系业务更新。','This quote has expired. Please contact sales.'),'error');return}modal(T('确认接受报价','Accept this quotation'),`<div class="kvgrid">${kv(T('报价','Quotation'),e(q.id)+' / V'+q.revision)}${kv(T('总额','Total'),money(q.total,q.currency))}${kv(T('预付款','Deposit'),money(deposit(q),q.currency))}</div><div class="mt">${notice(T('这是演示确认，将创建一张待预付款的样例销售订单。不会自动扣库存或释放生产，也不代表真实签署合同。','This demo acceptance creates a sample order awaiting deposit. It does not reserve inventory, release production or sign a real contract.'),'warning')}</div>`,button(T('取消','Cancel'),'close')+button(T('确认接受并生成订单','Accept and create order'),'doAcceptQuote',id,'primary','check'),'narrow')}
function nextId(prefix,arr){const date=dayStr().replace(/-/g,'').slice(2);let n=arr.length+1,id;do{id=`${prefix}-${date}-${String(n++).padStart(3,'0')}`}while(arr.some(x=>x.id===id));return id}
function snapshotRows(rows,cur){return rows.map(i=>{const p=prod(i.product);return {product:p.id,qty:i.qty,price:i.price,name:p.name,en:p.en,sku:p.sku,spec:p.spec,listPrice:cur==='USD'?p.usd:p.price,cost:p.cost}})}
function customerSnapshot(c){return {name:c.name,en:c.en,contact:c.contact,email:c.email,address:c.address,country:c.country,phone:c.phone}}
function updateOrderHistory(o,text){o.history.push({at:S.now,text,actor:roleName(U.role)})}
function download(content,name,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s)&&!/^[-+]?\d+(\.\d+)?$/.test(s.trim()))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvDownload(headers,rows,name){download('\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),name,'text/csv;charset=utf-8');toast('已生成当前权限范围的 CSV 文件。')}
function exportData(kind){if(U.mode!=='internal')return accessError();if(kind==='products'){const show=moneyVisible();csvDownload(['SKU','名称','规格','起订量','单位',...(show?['标准销售价CNY','标准销售价USD']:[]),...(costVisible()?['成本CNY（受限）']:[]),'交期天数'],S.products.map(p=>[p.sku,p.name,p.spec,p.moq,p.unit,...(show?[dec(p.price),dec(p.usd)]:[]),...(costVisible()?[p.cost==null?'待核价':dec(p.cost)]:[]),p.lead]),'产品资料_演示.csv')}
else if(kind==='customers'){csvDownload(['客户编号','公司','地区','联系人','邮箱','负责人','成交状态','下次维护'],customers().map(c=>[c.id,c.name,c.country,c.contact,c.email,roleName(c.owner),trade(c)?'已成交':'未成交',niceDate(dueFor('customer',c))]),'客户档案_演示.csv')}
else if(kind==='orders'){csvDownload(['订单号','客户','币种',...(moneyVisible()?['订单金额','已核实回款','未结余额']:[]),'履约状态','预计交期','柜号','运单号'],orders().map(o=>[o.id,cust(o.customer).name,o.currency,...(moneyVisible()?[dec(o.total),dec(paid(o)),dec(balance(o))]:[]),orderStatus(o)[0],o.eta,o.container,o.tracking]),'订单台账_演示.csv')}
else if(kind==='quotes'){if(!canQuote())return accessError();csvDownload(['报价编号','版本','客户','币种','金额','状态','有效期'],quotes().map(q=>[q.id,q.revision,cust(q.customer).name,q.currency,dec(q.total),quoteStatus(q)[0],q.valid]),'报价台账_演示.csv')}
log('按当前权限导出CSV',kind)}
function downloadTemplate(id){const tmp={products:[['SKU','名称','英文名称','规格','起订量','标准价CNY','标准价USD','交期天数'],['YX-DEMO-01','演示商品','Sample product','示例规格',100,'48.00','6.80',10]],customers:[['外部客户编号','公司','地区','联系人','邮箱','负责人账号','默认币种'],['C-DEMO-01','样例客户公司','中国大陆','演示联系人','buyer@example.test','sales','CNY']],orders:[['外部订单编号','客户编号','SKU','数量','单价','币种','确认日期'],['SO-DEMO-01','C-DEMO-01','YX-DEMO-01',100,'48.00','CNY','2026-10-20']]};const t=tmp[id]||tmp.products;csvDownload(t.slice(0,1)[0],[t[1]],id+'_字段模板_仅样例.csv')}
function scan(){let added=0;for(const t of getTasks()){const levels=[['normal',t.owner]];if(daysLate(t.due)>=S.rules.escalationDays&&t.owner!=='owner')levels.push(['escalation',t.owner==='manager'||t.type==='payment'?'owner':'manager']);for(const [level,recipient] of levels){const key=t.key+'|'+level+'|'+recipient;if(S.events.some(x=>x.key===key))continue;S.events.push({id:nextId('NT',S.events),key,entity:t.entity,type:t.type,title:t.title,recipient,level,due:t.due,at:S.now,read:false,resolved:false});added++}}log('模拟提醒扫描',added+' 条新增通知');render();toast(added?`扫描完成：新增 ${added} 条样例通知（含升级），未发送外部消息。`:'扫描完成：没有新增通知，同一轮次已去重。')}
function taskOpen(key){const t=tasks().find(x=>x.key===key);if(!t)return toast('该待办已更新或不在当前数据范围。','error');if(t.type==='customer')customerDetail(t.entity);else if(['approval','quote'].includes(t.type))quoteDetail(t.entity);else orderDetail(t.entity)}
function notificationModal(){const list=S.events.filter(x=>x.recipient===U.role).slice().reverse();modal('我的站内通知',notice('此处是模拟扫描生成的本机通知。已读只改变阅读状态，不会结束业务跟进任务。')+`<div class="mt">${table(['时间','通知','关联对象','状态','操作'],list.map(n=>tr([niceDate(n.at,true),e(n.title)+(n.level==='escalation'?' '+pill('升级','amber'):''),e(n.entity),pill(n.read?'已读':'未读',n.read?'':'green'),n.read?'—':button('标记已读','readNotification',n.id,'sm')])))} </div>`,button('关闭','close'),'wide')}
function importPreview(){modal('历史数据导入 · 预检样例',notice('本窗口是导入预检结果的交互示意，没有上传或写入任何数据。正式开发需实现模板映射、逐行校验、幂等与业务对账。','warning')+`<div class="grid3 mt">${stat('待校验行',5,'样例商品表','file')}${stat('可导入',3,'全部必要字段有效','check')}${stat('需要修正',2,'错误必须定位到行和列','alert')}</div><div class="mt">${table(['源文件行','SKU','结果','提示'],[tr([2,'YX-DEMO-01',pill('可导入','green'),'新商品；期初库存另行导入']),tr([3,'YX-DEMO-02',pill('可导入','green'),'新商品；币种CNY']),tr([4,'YX-DEMO-03',pill('可导入','green'),'新商品；数量符合单位精度']),tr([5,'YX-TM500',pill('需处理','red'),'SKU已存在：需选择明确的更新规则']),tr([6,'YX-DEMO-05',pill('需处理','red'),'起订量不能为0，错误列：MOQ'])])}</div>`,button('关闭','close')+button('下载产品模板','template','products','primary','down'),'wide')}
function action(a,id=''){
if(a==='close'){closeModal();return}
if(a==='mobileMenu'){U.mobile=!U.mobile;render();return}
if(a==='nav'){closeModal();goto(id);return}
if(a==='help'){help();return}if(a==='guide'){guide();return}
if(a==='portal'){closeModal();U.mode='portal';U.portalTab='products';U.mobile=false;render();window.scrollTo(0,0);return}
if(a==='internal'){closeModal();U.mode='internal';document.documentElement.lang='zh-CN';render();window.scrollTo(0,0);return}
if(a==='portalTab'){closeModal();U.portalTab=id;render();window.scrollTo(0,0);return}
if(a==='portalCategory'){U.portalCategory=id;render();return}
if(a==='language'){U.lang=U.lang==='zh'?'en':'zh';render();return}
if(a==='walkthrough'){closeModal();U.mode='internal';U.tab='';U.role={overview:'owner',customer:'sales',approval:'sales',payment:'finance',reminder:'sales',permission:'owner'}[id]||'owner';U.view={overview:'dashboard',customer:'dashboard',approval:'quotes',payment:'payments',reminder:'tasks',permission:'products'}[id]||'dashboard';if(id==='payment')U.tab='ledger';if(id==='customer'){U.mode='portal';U.customer='c1';U.portalTab='products';U.lang='zh'}render();window.scrollTo(0,0);return}
if(a==='customerDetail'){customerDetail(id);return}if(a==='productDetail'){productDetail(id);return}if(a==='orderDetail'){orderDetail(id);return}if(a==='quoteDetail'){quoteDetail(id);return}if(a==='inquiryDetail'){inquiryDetail(id);return}if(a==='contractDetail'){contractDetail(id);return}if(a==='receiptDetail'){receiptDetail(id);return}
if(a==='newCustomer'){customerForm();return}if(a==='newProduct'){productForm();return}if(a==='editCost'){costForm(id);return}if(a==='follow'){followForm(id);return}if(a==='newQuote'){quoteForm();return}
if(a==='editQuote'){const q=findQuote(id);if(!q||q.status!=='draft'||!visibleRow(q))return accessError();quoteForm({edit:q});return}
if(a==='reviseQuote'){const q=findQuote(id);if(!q||!['approved','rejected'].includes(q.status)||!visibleRow(q))return accessError();if(S.quotes.some(x=>x.group===q.group&&x.status==='accepted'))return toast('该业务已转正式订单，需通过订单变更流程处理。','error');quoteForm({revise:q});return}
if(a==='quoteFromInquiry'){const q=S.inquiries.find(x=>x.id===id);if(!q||q.status!=='new'||!visibleRow(q))return accessError();quoteForm({source:q});return}

if(kind==='inventory'){if(U.role!=='warehouse')return accessError();const p=prod(str('product'));const qty=Number(str('qty'));if(!p||!Number.isInteger(qty)||qty<1||qty>1000000)return fail('请填写有效正整数数量。');const signed=str('direction')==='out'?-qty:qty;if(signed<0&&qty>available(p))return fail('不能减少已为订单预留的库存，调整数量超过可用量。');if(str('reason').length<5)return fail('请填写明确的调整依据。');p.stock+=signed;S.ledger.push({at:S.now,product:p.id,qty:signed,type:signed>0?'调整入库（样例）':'盘亏调整（样例）',ref:str('reason')});log('库存调整登记',p.sku);closeModal();render();toast('已写入库存流水并更新可用量。');return}

if(kind==='delivery'){const o=modalState&&findOrder(modalState.id);if(U.role!=='warehouse'||!canSeeOrder(o)||o.stage!=='shipped'||o.status!=='confirmed')return accessError();if(str('date')>dayStr()||str('date')<(o.shippedAt?dayStr(o.shippedAt):o.date))return fail('签收日期不能早于发运/订单日期或晚于演示当前日期。');o.stage='delivered';o.deliveredAt=str('date');updateOrderHistory(o,'已整单签收：'+str('note'));log('登记签收',o.id);closeModal();render();orderDetail(o.id);toast(balance(o)>0?'已签收，但尾款尚未结清，订单仍未完成。':'已签收且回款结清，可由业务完成订单。');return}
if(kind==='contract'){if(!canQuote())return accessError();const o=findOrder(str('order'));if(!canSeeOrder(o))return fail('关联订单不在当前授权范围。');if(str('valid')<dayStr())return fail('合同有效期不能早于演示当前日期。');const c={id:nextId('CT',S.contracts),order:o.id,title:str('title'),status:'pending',version:1,date:dayStr(),valid:str('valid')};S.contracts.push(c);log('创建合同档案样例',c.id);closeModal();U.view='contracts';render();contractDetail(c.id);return}
if(kind==='rules'){if(!['owner','manager','admin'].includes(U.role))return accessError();const keys=Object.keys(S.rules);const next={};for(const k of keys){const n=Number(str(k));if(!Number.isInteger(n)||n<1||n>(k==='approvalHours'?168:365))return fail('请填写范围内的有效正整数。');next[k]=n}S.rules=next;S.ruleVersion=(S.ruleVersion||1)+1;log('调整提醒规则','v'+S.ruleVersion);render();toast('规则已保存；未指定人工计划的业务按新周期计算。');return}
if(kind==='profile'){if(U.mode!=='portal')return accessError();const c=cust(U.customer);c.contact=str('contact');c.email=str('email');c.phone=str('phone');c.address=str('address');log('客户修改本机联系资料样例',c.id);closeModal();render();toast(T('联系资料已更新，历史单据快照保持不变。','Contact details updated; document snapshots are unchanged.'));return}
if(kind==='basket'){if(U.mode!=='portal'||!U.basket.length)return accessError();const c=cust(U.customer);const rows=[];for(const b of U.basket){const p=prod(b.product),qty=Number(str('qty-'+p.id));if(!Number.isInteger(qty)||qty<p.moq||qty>1000000)return fail(T('商品数量需要满足对应MOQ，且不超过1,000,000件。','Quantities must meet MOQ and remain below 1,000,000.'));rows.push({product:p.id,qty,price:c.currency==='USD'?p.usd:p.price})}if(str('eta')<dayStr())return fail(T('交付日期不能早于演示日期。','Delivery cannot be earlier than the demo date.'));const q={id:nextId('IR',S.inquiries),customer:c.id,owner:c.owner,date:dayStr(),type:str('type'),status:'new',items:snapshotRows(rows,c.currency),currency:c.currency,note:str('note'),eta:str('eta'),address:str('address')};S.inquiries.unshift(q);U.basket=[];log('客户提交采购申请',q.id);closeModal();U.portalTab='orders';render();inquiryDetail(q.id);toast(T('申请已提交，销售端可以受理；没有创建生产任务。','Request submitted for sales review. No production task was created.'));return}
}
let searchTimer;
document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(el?.disabled)return;if(el?.dataset.action){ev.preventDefault();try{action(el.dataset.action,el.dataset.id||'')}catch(err){console.error(err);toast('演示操作遇到错误，请恢复样例后重试。','error')}return}if(el?.dataset.view){closeModal();goto(el.dataset.view);return}if(el?.dataset.tab){U.tab=el.dataset.tab;render();return}if(ev.target.classList.contains('overlay'))closeModal()});
document.addEventListener('submit',ev=>{const form=ev.target;if(!form.dataset.form)return;ev.preventDefault();if(!form.reportValidity())return;try{handleSubmit(form)}catch(err){console.error(err);errorForm(form,'演示操作发生错误，请检查输入或恢复样例。')}});
document.addEventListener('change',ev=>{const el=ev.target;const k=el.dataset.change;if(k==='role'){if(!roles[el.value])return;closeModal();U.role=el.value;U.tab='';U.globalSearch='';render();return}if(k==='currency'){U.currency=el.value;render();return}if(k==='filterStatus'){U.filters[U.view]={...(U.filters[U.view]||{}),status:el.value};render();return}if(k==='portalCompany'){U.customer=el.value;U.basket=[];render();return}if(k==='quoteCurrency'&&modalState?.kind==='quote'){syncQuoteRows();for(const r of modalState.rows){const p=prod(r.product);r.price=el.value==='USD'?p.usd:p.price}document.getElementById('quoteLines').innerHTML=quoteRowsHTML();calcQuote();return}if(k==='receiptOrder'){const o=findOrder(el.value),form=document.getElementById('receiptForm');form.elements.amount.value=dec(Math.min(balance(o),Math.max(0,deposit(o)-paid(o))||balance(o)));document.getElementById('receiptBalance').innerHTML=notice(`当前未结余额 ${money(balance(o),o.currency)}。同一交易号不能重复登记。`,'success');return}if(el.dataset.qproduct!==undefined&&modalState?.kind==='quote'){syncQuoteRows();const i=Number(el.dataset.qproduct),p=prod(el.value),cur=document.getElementById('q-currency').value;modalState.rows[i]={product:p.id,qty:p.moq,price:cur==='USD'?p.usd:p.price};document.getElementById('quoteLines').innerHTML=quoteRowsHTML();calcQuote();return}if(el.dataset.bqty){const b=U.basket.find(b=>b.product===el.dataset.bqty);if(b&&Number.isInteger(Number(el.value))&&Number(el.value)>0)b.qty=Number(el.value)}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.hasAttribute('data-qcalc')){calcQuote();return}if(el.dataset.search){const v=el.value,id=el.id,start=el.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(el.dataset.search==='page')U.filters[U.view]={...(U.filters[U.view]||{}),q:v};else U.portalQ=v;render();const ne=document.getElementById(id);if(ne){ne.focus();try{ne.setSelectionRange(start,start)}catch{}}},130)}});
document.addEventListener('keydown',ev=>{const dlg=document.querySelector('.dialog');if(ev.key==='Escape'){if(dlg)closeModal();else if(U.mobile){U.mobile=false;render()}return}if(ev.key==='Tab'&&dlg){const els=[...dlg.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href]')].filter(x=>x.offsetParent!==null);const first=els[0],last=els[els.length-1];if(ev.shiftKey&&document.activeElement===first){last?.focus();ev.preventDefault()}else if(!ev.shiftKey&&document.activeElement===last){first?.focus();ev.preventDefault()}}});
render();

</script>

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vesta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vesta_local_only}
      POSTGRES_DB: vesta
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: vesta_local
      MINIO_ROOT_PASSWORD: vesta_local_storage_only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["attachment_data:/data"]
volumes:
  postgres_data:
  attachment_data:
